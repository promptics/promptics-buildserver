# Scales each Hetzner runner pool to the jobs waiting for it (scaler/pool.py). Started by the org
# webhook's receiver (webhook/, a Cloudflare Worker) the moment any promptics job queues for a pool
# label; the schedule is only a backstop sweep, since GitHub fires it hours apart here. Every pool is one
# matrix entry and works the same way; adding a pool is one entry plus its project's token.
# The servers delete themselves at the end of an idle billing hour (scaler/reaper.sh); this
# controller creates what demand needs and sweeps what a dead reaper left behind.
#
# Repository variable:
#   HCLOUD_SSH_KEY    name of an SSH key in the pool's Hetzner project; every server is created with it
#                     so Hetzner sends no root-password email. Required: the run fails without it.
#
# Secrets (repository secrets; the promptics org is on GitHub Free, no org secrets):
#   HCLOUD_TOKEN_CI   read/write token of the pool's own Hetzner Cloud project (it reaches nothing else)
#   RUNNER_PAT        classic PAT with admin:org (org runner registration/removal)
#                     and repo (reading the queued jobs of private repos)
#   POOL_PRIVILEGED_REPOS  space-separated names of the repos whose jobs on main may use the
#                     one-job pool promptics-privileged. A secret, not a variable, so
#                     the names stay out of this public repository's logs. Unset: that pool creates
#                     nothing.
#
# Pools:
#   promptics-pool        shared: a server takes many jobs of any repo while its billing hour lasts.
#   promptics-privileged  one-job: each server takes exactly one job, then deletes itself, so a job
#                         may be given what it must not share with other jobs, such as a privileged
#                         container. Only runs on main of the listed repos get one, started by a
#                         schedule, by hand, by a push to main, or after another run on main; its runner refuses every other job before the job's first step. It
#                         boots from the shared pool's snapshot and has its own server limit, which
#                         adds to the shared pool's.
name: pool scale

on:
  schedule:
    - cron: "2-59/5 * * * *"   # off the round minutes, where GitHub delays schedules most
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print, change nothing"
        type: boolean
        default: false

concurrency:
  group: pool-scale        # two controllers at once could both create for the same queued job
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: promptics-pool
            org: promptics
            repos: ""        # every repo of the org: a run always scans them all, since concurrency keeps only the newest pending run
            candidates: "cx43:fsn1 cx43:nbg1 cx43:hel1 cpx42:fsn1 cpx42:nbg1 cpx42:hel1"
            max_servers: 8   # One job per server (two builds on one 8-vCPU server ran past their time limit). A create the project's limits refuse stops creating for that run with a warning
            slots: 1
            idle_keep_min: 60    # keep an idle server for another billed hour while a job ended within the last hour (scaler/reaper.sh)
            idle_keep_max: 2     # at most this many servers kept warm at once; further idle servers go as usual
            token: HCLOUD_TOKEN_CI
          - pool: promptics-privileged
            org: promptics
            repos_secret: POOL_PRIVILEGED_REPOS   # the repos come from a secret, so they never appear in a log
            events: "schedule workflow_dispatch push workflow_run"  # never a pull request; the runner also requires main
            one_job: "1"
            image_pool: promptics-pool            # the shared pool's snapshot; no bake of its own
            candidates: "cx43:fsn1 cx43:nbg1 cx43:hel1 cpx42:fsn1 cpx42:nbg1 cpx42:hel1"
            max_servers: 1
            slots: 1
            token: HCLOUD_TOKEN_CI
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reconcile ${{ matrix.pool }}
        env:
          POOL: ${{ matrix.pool }}
          ORG: ${{ matrix.org }}
          REPOS: ${{ matrix.repos_secret && secrets[matrix.repos_secret] || matrix.repos }}
          EVENTS: ${{ matrix.events }}
          ONE_JOB: ${{ matrix.one_job }}
          IDLE_KEEP_MIN: ${{ matrix.idle_keep_min }}
          IDLE_KEEP_MAX: ${{ matrix.idle_keep_max }}
          IMAGE_POOL: ${{ matrix.image_pool }}
          CANDIDATES: ${{ matrix.candidates }}
          MAX_SERVERS: ${{ matrix.max_servers }}
          SLOTS: ${{ matrix.slots }}
          HCLOUD_TOKEN: ${{ secrets[matrix.token] }}
          HCLOUD_SSH_KEY: ${{ vars.HCLOUD_SSH_KEY }}
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scaler/pool.py reconcile
