# Scales each Hetzner runner pool to the jobs waiting for it (scaler/pool.py). Started by the org
# webhook's receiver (webhook/, a Cloudflare Worker) the moment any promptics job queues for a pool
# label; the schedule is only a backstop sweep, since GitHub fires it hours apart here. Every pool is one
# matrix entry and works the same way; adding a pool is one entry plus its project's token.
# The servers delete themselves at the end of an idle billing hour (scaler/reaper.sh); this
# controller creates what demand needs and sweeps what a dead reaper left behind.
#
# Secrets (repository secrets; the promptics org is on GitHub Free, no org secrets):
#   HCLOUD_TOKEN_CI   read/write token of the pool's own Hetzner Cloud project (it reaches nothing else)
#   RUNNER_PAT        classic PAT with admin:org (org runner registration/removal)
#                     and repo (reading the queued jobs of private repos)
name: pool scale

on:
  schedule:
    - cron: "2-59/5 * * * *"   # off the round minutes, where GitHub delays schedules most
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print, change nothing"
        type: boolean
        default: false

concurrency:
  group: pool-scale        # two controllers at once could both create for the same queued job
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: promptics-pool
            org: promptics
            repos: ""        # every repo of the org: a run always scans them all, since concurrency keeps only the newest pending run
            candidates: "cx43:fsn1 cx43:nbg1 cx43:hel1 cpx42:fsn1 cpx42:nbg1 cpx42:hel1"
            max_servers: 8   # one job per server: two builds on one 8-vCPU server ran past their time limit
            slots: 1
            token: HCLOUD_TOKEN_CI
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reconcile ${{ matrix.pool }}
        env:
          POOL: ${{ matrix.pool }}
          ORG: ${{ matrix.org }}
          REPOS: ${{ matrix.repos }}
          CANDIDATES: ${{ matrix.candidates }}
          MAX_SERVERS: ${{ matrix.max_servers }}
          SLOTS: ${{ matrix.slots }}
          HCLOUD_TOKEN: ${{ secrets[matrix.token] }}
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scaler/pool.py reconcile
